<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - N.A Fresh Fruits & Coconuts</title>
    <meta name="theme-color" content="#235d3a">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8faf8] text-gray-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-gray-100 shadow-sm text-center space-y-5">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-50 text-[#235d3a] flex items-center justify-center">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364m0 0a9 9 0 012.828-6.364m0 0l2.829 2.829M3 3l18 18"></path>
            </svg>
        </div>
        
        <div>
            <h1 class="text-2xl font-black text-gray-900 tracking-tight">You're Offline</h1>
            <p class="text-xs text-gray-500 mt-2 leading-relaxed">
                It looks like your internet connection is currently unavailable. Please check your data or Wi-Fi to browse our fresh coconuts and place orders.
            </p>
        </div>

        <div class="pt-2">
            <button onclick="window.location.reload()" class="w-full bg-[#235d3a] hover:bg-[#1b4a2e] text-white font-bold text-xs py-3 px-6 rounded-xl transition shadow-xs">
                Retry Connection
            </button>
        </div>

        <p class="text-[11px] text-gray-400">
            N.A Fresh Fruits & Coconuts &bull; Farm Fresh Daily
        </p>
    </div>
</body>
</html>
